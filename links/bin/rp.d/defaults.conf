# Default source roots searched by `rp`, one path per line.
#
# Blank lines and `#` comments are ignored; leading `~` and `$HOME` are
# expanded. Roots that don't exist are silently skipped.
#
# This file is tracked in the dotfiles repo. To add machine-specific roots
# without editing it, set RP_SRC_ROOTS (colon-separated, PATH-style) in an
# untracked shell rc, e.g.:
#
#   export RP_SRC_ROOTS="$HOME/work/repos:$HOME/clients/acme"
#
~/src
~/projects
