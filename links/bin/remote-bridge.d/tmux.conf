# Sourced by tmux.conf on hosts that use remote-bridge.

# OpenCode wraps its OSC 52 copies in tmux passthrough, so they reach the desktop terminal directly.
set -g allow-passthrough on

# Copies reach the desktop clipboard through the bridge as well as through OSC 52.
set -s copy-command '~/.dotfiles/links/bin/remote-bridge.d/bridge-copy'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
set-hook -g pane-set-clipboard "run-shell -b 'tmux save-buffer - | ~/.dotfiles/links/bin/remote-bridge.d/bridge-copy'"

# OpenCode reads images from the clipboard of the host it runs on, so here Ctrl+V pastes the
# desktop's screenshot as a file path instead.
bind -n C-v if -F '#{==:#{pane_current_command},opencode}' \
  "run-shell -b '~/.dotfiles/links/bin/remote-bridge.d/bridge-paste #{pane_id}'" \
  'send-keys C-v'
