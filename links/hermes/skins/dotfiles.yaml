name: dotfiles
description: Daylight, with user messages in the tmux accent orange
tool_prefix: "│"
branding:
  help_header: "[?] Available Commands"
# Copied from the built-in daylight skin; custom skins merge over "default", not daylight.
colors:
  banner_border: "#2563EB"
  banner_title: "#0F172A"
  banner_accent: "#1D4ED8"
  banner_dim: "#475569"
  banner_text: "#111827"
  ui_accent: "#2563EB"
  ui_label: "#0F766E"
  ui_ok: "#15803D"
  ui_error: "#B91C1C"
  ui_warn: "#B45309"
  prompt: "#111827"
  input_rule: "#6E94BE"
  response_border: "#2563EB"
  status_bar_bg: "#E5EDF8"
  status_bar_text: "#111827"
  status_bar_strong: "#2563EB"
  status_bar_dim: "#838890"
  status_bar_good: "#15803D"
  status_bar_warn: "#B45309"
  status_bar_bad: "#B45309"
  status_bar_critical: "#B91C1C"
  session_label: "#1D4ED8"
  session_border: "#64748B"
  completion_menu_bg: "#F8FAFC"
  completion_menu_current_bg: "#DBEAFE"
  completion_menu_meta_bg: "#EEF2FF"
  completion_menu_meta_current_bg: "#BFDBFE"
  selection_bg: "#D3E0FB"
  shell_dollar: "#2563EB"
  voice_status_bg: "#E5EDF8"
# User messages (ui_label) use the tmux accent_fg in links/tmux/themes/{dark,light}.conf;
# replies (ui_response, added by hermes-patch.d/reply-color) use Tokyo Night purple;
# other text, including tool output, keeps the base ui_text.
dark_colors:
  ui_label: "#ff966c"
  ui_response: "#c099ff"
light_colors:
  ui_label: "#b15c00"
  ui_response: "#7847bd"
