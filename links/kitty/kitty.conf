# vim:ft=kitty

# Fonts
font_family Monofur Nerd Font Mono
font_size 12

# Window
window_padding_width 0 0 0 0
hide_window_decorations yes

# Ctrl and click to open a link
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url

# Send the CSI u form of keys kitty would otherwise encode ambiguously or intercept
map ctrl+minus send_text all \x1b[45;5u
map ctrl+enter send_text all \x1b[13;5u
map shift+enter send_text all \x1b[13;2u

# Animated cursor
cursor_trail 3

include themes/dark.conf
include ~/.local/state/dotfiles/theme/kitty.conf
