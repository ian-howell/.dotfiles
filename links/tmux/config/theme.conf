set-environment -g COLORTERM truecolor
set -g focus-events on

# Use checked-in defaults before the first switch. Theme refresh reloads this.
source-file ~/.config/tmux/themes/dark.conf
set-environment -g BAT_CONFIG_PATH "$HOME/.dotfiles/links/bat/dark.conf"
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.dotfiles/links/zsh/fzf-themes/dark.conf"
set-environment -g LG_CONFIG_FILE "$HOME/.dotfiles/links/lazygit.yml,$HOME/.dotfiles/links/lazygit/themes/dark.yml"
set-environment -g K9S_SKIN tokyonight-moon
if-shell 'test "$(cat "$HOME/.local/state/dotfiles/theme/mode" 2>/dev/null)" = light' {
    source-file ~/.config/tmux/themes/light.conf
    set-environment -g BAT_CONFIG_PATH "$HOME/.dotfiles/links/bat/light.conf"
    set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.dotfiles/links/zsh/fzf-themes/light.conf"
    set-environment -g LG_CONFIG_FILE "$HOME/.dotfiles/links/lazygit.yml,$HOME/.dotfiles/links/lazygit/themes/light.yml"
    set-environment -g K9S_SKIN tokyonight-day
}
# Parse styles after the selected palette has set its variables.
source-file ~/.config/tmux/themes/style.conf
if-shell 'test -r "${XDG_CONFIG_HOME:-$HOME/.config}/k9s/skins/dotfiles.yaml"' 'set-environment -g K9S_SKIN dotfiles'
