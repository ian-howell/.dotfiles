set-environment -g COLORTERM truecolor
set -g focus-events on

# Source the palette before parsing the styles that reference its variables.
source-file ~/.config/tmux/themes/dark.conf
source-file -q ~/.local/state/dotfiles/theme/tmux.conf
source-file ~/.config/tmux/themes/style.conf

# Files are read at invocation time, including for commands launched by tmux.
set-environment -g BAT_CONFIG_PATH "$HOME/.local/state/dotfiles/theme/bat.conf"
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.local/state/dotfiles/theme/fzf.conf"
set-environment -g LG_CONFIG_FILE "$HOME/.dotfiles/links/lazygit.yml,$HOME/.local/state/dotfiles/theme/lazygit.yml"
set-environment -g K9S_SKIN dotfiles
