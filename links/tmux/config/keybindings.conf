###############################################################################
# Key Bindings
###############################################################################
# NOTE: As a general "cleanliness" rule, prefer 'bind' to 'bind-key'

# Unset default prefix
unbind C-b
unbind C-a

# Set Prefix to Ctrl+space
set -g prefix C-space
# Toggle every local theme, even when an editor/TUI owns the focused pane.
bind -n -N "custom: toggle light/dark themes" M-t run-shell -b 'mode=$(~/.bin/theme get) && if [ "$mode" = dark ]; then ~/.bin/theme light; else ~/.bin/theme dark; fi'
# Send a literal C-Space to the inner program (e.g. nested tmux or editors
# that use C-Space for completions). Press the prefix twice: C-Space C-Space.
bind -N "custom: send prefix (for nested tmux or editors using C-Space)" \
  C-space send-prefix

# Intentionally unbind "detach" since I never want to fat-finger detach from a session.
# Use :detach or `tmux detach` instead.
unbind d

###############################################################################
# Session tools
###############################################################################
# run-shell's -c argument does not expand formats on tmux 3.5a. Change directory
# in its format-expanded command instead; q: quotes paths for the shell.

# ts  — switch active tmux sessions (fzf picker, Ctrl-X to kill)
bind -N "custom: ts — active session switcher" \
  C-s run-shell -b \
  "cd -- #{q:pane_current_path} && PICKER_SOURCE_PANE='#{pane_id}' PICKER_SOURCE_SESSION='#{session_id}' ts"

# wt  — git worktree sessions (fzf branch picker, creates worktree + session)
bind -N "custom: wt — git worktree picker" \
  C-w run-shell -b \
  "cd -- #{q:pane_current_path} && PICKER_SOURCE_PANE='#{pane_id}' PICKER_SOURCE_SESSION='#{session_id}' wt"

# wt (quick) — narrow popup: type a branch name via gum input, run wt
bind -N "custom: wt (quick) — type branch name" \
  C-t display-popup -w 60 -h 3 -EE \
  -d "#{pane_current_path}" \
  'branch=$(gum input --placeholder "branch name" --no-show-help) && [ -n "$branch" ] && wt "$branch"'

# rp  — repo project sessions (fzf picker over the configured source roots)
bind -N "custom: rp — repo project picker" \
  C-p run-shell -b \
  "cd -- #{q:pane_current_path} && PICKER_SOURCE_PANE='#{pane_id}' PICKER_SOURCE_SESSION='#{session_id}' rp"

# dot — jump directly to the dotfiles session (~/.dotfiles)
bind -N "custom: dot — jump to dotfiles session" \
  C-d run-shell "dot"

# ssh-session — SSH host sessions (fzf picker from SSH configuration)
bind -N "custom: ssh-session — SSH host picker" \
  C-h run-shell -b \
  "cd -- #{q:pane_current_path} && PICKER_SOURCE_PANE='#{pane_id}' PICKER_SOURCE_SESSION='#{session_id}' ssh-session"

# Kubernetes context and namespace switchers
bind-key -N "custom: k8s context switcher" C run-shell "k8s-context-switcher"
bind-key -N "custom: k8s namespace switcher" N run-shell "k8s-namespace-switcher"

# Split panes using \ and - (\ because it doesn't require shift)
# Start in same directory when splitting windows
bind -N "custom: split pane horizontal (same dir)" \
  \\ split-window -h -c '#{pane_current_path}'
bind -N "custom: split pane vertical (same dir)" \
  - split-window -v -c '#{pane_current_path}'

# When creating a window, start at the session's default path
bind -N "custom: new window (session path)" \
  C-c new-window -c '#{session_path}' "$SHELL"


# Sane window switching
# Show conversation titles for OpenCode without inherited titles from other apps.
bind -N "custom: window tree with conversation titles" \
  w choose-tree -Zw -F '#{?session_format,#{session_windows} windows#{?session_attached, (attached),},#{?window_format,#{window_name}#{window_flags},#{pane_current_command}}#{?#{==:#{pane_current_command},opencode},#{?#{?#{@opencode-title},#{@opencode-title},#{s/^OC [|] //:pane_title}}, — #{?#{@opencode-title},#{@opencode-title},#{s/^OC [|] //:pane_title}},},}}'
unbind .
bind -N "custom: move window to index" \
  m command-prompt -p "Move to index:" \
  "run-shell 'tmux-insert-window %%'"

# Use vim keybindings in copy mode
set -g mode-keys vi

# Visual selection toggles (vim-like)
# v: checks #{selection_present}; if set, just turns rectangle mode off so the current range stays, otherwise begins selection
bind -T copy-mode-vi v if-shell -F "#{selection_present}" "send-keys -X rectangle-off" "send-keys -X begin-selection"
# V: if selecting, turns rectangle off, jumps to the other end, snaps that end to start-of-line, jumps back, snaps to end-of-line
# It's a bit buggy, but it's *way* better than the default behavior.
bind -T copy-mode-vi V if-shell -F "#{selection_present}" "send-keys -X rectangle-off \; send-keys -X other-end \; send-keys -X start-of-line \; send-keys -X other-end \; send-keys -X end-of-line" "send-keys -X select-line"
# C-v: if selecting, toggles rectangle via #{rectangle_toggle} without resetting; if not, begins selection then turns rectangle on
bind -T copy-mode-vi C-v if-shell -F "#{selection_present}" "if-shell -F \"#{rectangle_toggle}\" \"send-keys -X rectangle-off\" \"send-keys -X rectangle-on\"" "send-keys -X begin-selection \; send-keys -X rectangle-on"

# Exit copy mode with Escape
bind -T copy-mode-vi Escape send-keys -X cancel

# Easier access to the paster-buffer
bind -N "custom: paste buffer" P paste-buffer
# Native selection copies into tmux and forwards to the terminal clipboard.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Flash uses native copy-mode, preserving selections across jumps.
set -g @flash-case smart
bind -N "custom: Flash jump in native copy-mode" \
  s if-shell -F '#{>=:#{version},3.6}' {
    run-shell -b '"$HOME/.local/bin/flash_tmux" --pane=#{pane_id}'
  } {
    display-message 'Flash requires a tmux 3.6+ server; this server is #{version}.'
  }
bind -T copy-mode-vi -N "custom: Flash jump / extend selection" \
  s if-shell -F '#{>=:#{version},3.6}' {
    run-shell -b '"$HOME/.local/bin/flash_tmux" --pane=#{pane_id}'
  } {
    display-message 'Flash requires a tmux 3.6+ server; this server is #{version}.'
  }

# Enter copy-mode and immediately start a search.
bind -N "custom: copy-mode + search" \
  / copy-mode \; command-prompt -i -T search -p "(search up)" { send-keys -X search-backward-incremental "%%" }

# Reload config file
bind -N "custom: reload tmux config" \
  C-r source-file ~/.config/tmux/tmux.conf \; \
  display '~/.config/tmux/tmux.conf sourced'

# Recreate only this terminal connection when input/rendering gets backed up.
# See ../README.md for diagnosis; this is recovery, not a proven prevention fix.
bind -N "custom: reconnect client (recover terminal lag)" \
  R run-shell -b 'tmux-reconnect #{q:socket_path} #{q:client_name} #{q:session_id}'

# Shortcut keys
bind -N "custom: new window — nvim" \
  C-v new-window -c '#{session_path}' nvim
bind -N "custom: new window — opencode" \
  C-o new-window -c '#{session_path}' opencode --port --auto
bind -N "custom: new window — lazygit" \
  C-g new-window -c '#{session_path}' lazygit
bind -N "custom: new window — k9s" \
  C-k new-window -c '#{session_path}' k9s

bind -N "custom: last window" C-l select-window -t "{last}"
# If the previous session closed, fall back to the most recently attached survivor.
bind -N "custom: last session (most recent surviving fallback)" \
  L run-shell 'tmux-last-session #{q:socket_path} #{q:client_name}'

###############################################################################
# Tmux Nagivator - https://github.com/christoomey/vim-tmux-navigator
###############################################################################

# Check if the current pane is a vim or lazygit pane
# NOTE: There is no lazygit-tmux-navigator plugin, so I won't be able to leave the
# lazygit window, but that's ok because lazygit will generally have a dedicated window.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_lg="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?lazygit$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h if-shell "$is_vim || $is_lg || $is_fzf" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim || $is_lg || $is_fzf" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim || $is_lg || $is_fzf" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim || $is_lg || $is_fzf" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

###############################################################################
# Popup keymaps
###############################################################################

bind -N "custom: htop popup" \
  H display-popup -w 90% -h 90% -E -b "rounded" "htop"
