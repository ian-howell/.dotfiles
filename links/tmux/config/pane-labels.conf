# Optional pane-label experiment. Disable with: tmux set -gw pane-border-status off
set -gw pane-border-status top
# Only OpenCode contributes a title; other programs may inherit stale shell titles.
# Prefer the plugin's full title; fall back for clients that have not loaded it yet.
set -gw pane-border-format ' #{pane_index}: #{E:@pane-program}#{?#{==:#{pane_current_command},opencode},#{?#{@opencode-status}, #{@opencode-status},}#{?#{?#{@opencode-title},#{@opencode-title},#{s/^OC [|] //:pane_title}}, │ #{?#{@opencode-title},#{@opencode-title},#{s/^OC [|] //:pane_title}},},} #{?#{==:#{E:@pane-program},hermes}, │ #{pane_title},} '
