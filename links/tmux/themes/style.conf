set -g window-active-style fg=default,bg=$active_bg
set -g window-style fg=default,bg=$inactive_bg

# Shared segmented layout; colors come from the selected palette.

set -g mode-style "fg=$accent_fg,bg=$highlight_bg"

set -g message-style "fg=$accent_fg,bg=$highlight_bg"
set -g message-command-style "fg=$accent_fg,bg=$highlight_bg"

set -g pane-border-style "fg=$highlight_bg,bg=$inactive_bg"
set -g pane-active-border-style "fg=$accent_fg,bg=$inactive_bg"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=$muted_fg,bg=$status_bg"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style "NONE,fg=$muted_fg,bg=$status_bg"

set -g status-left "#[fg=$segment_fg,bg=$segment_bg,bold] #S #[fg=$segment_bg,bg=$status_bg,nobold,nounderscore,noitalics]"

set -g status-right '#[default]'
set -ag status-right '#(cd #{pane_current_path}; git rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo "  $(git rev-parse --abbrev-ref HEAD)")'
set -ag status-right "#[fg=$status_bg,bg=$status_bg]#[fg=$accent_fg,bg=$status_bg]#{prefix_highlight}#[fg=$clock_bg,bg=$status_bg,nobold,nounderscore,noitalics]#[fg=$muted_fg,bg=$clock_bg] %Y-%m-%d  %H:%M #[fg=$segment_bg,bg=$clock_bg,nobold,nounderscore,noitalics]#[fg=$segment_fg,bg=$segment_bg,bold] #h "

setw -g window-status-activity-style "underscore,fg=$muted_fg,bg=$status_bg"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=$dimmed_fg,bg=$status_bg"
setw -g window-status-last-style "NONE,fg=$previous_fg,bg=$status_bg"
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=$status_bg,bg=$highlight_bg]#[fg=$accent_fg,bg=$highlight_bg,bold] #W  #[fg=$highlight_bg,bg=$status_bg]"
